<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Details - MyTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark px-4 shadow-sm mb-5" style="background: linear-gradient(90deg, #b92b27, #1565C0);">
        <a class="navbar-brand fw-bold fs-4" href="/user/dashboard">← Back to Dashboard</a>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0 mb-5 p-5 rounded-4 bg-white">
            <h1 class="display-4 fw-bold text-dark mb-3" th:text="${movie.title}">Title</h1>
            <p class="lead text-secondary mb-4" th:text="${movie.description}"></p>
            <div class="d-flex gap-3">
                <span class="badge bg-light text-dark border px-3 py-2 rounded-pill shadow-sm fs-6">🎙 <span
                        th:text="${movie.language}"></span></span>
                <span class="badge bg-light text-dark border px-3 py-2 rounded-pill shadow-sm fs-6">⏳ <span
                        th:text="${movie.durationMinutes}"></span> mins</span>
            </div>
        </div>

        <h3 class="fw-bold mb-4 text-dark">Available Shows</h3>
        <div class="row row-cols-1 row-cols-md-3 g-4 mb-5 pb-5">
            <div class="col" th:each="s : ${shows}">
                <div class="card h-100 border-0 shadow-sm p-4 text-center rounded-4 card-hover">
                    <span class="badge bg-dark rounded-pill mx-auto mb-3" style="font-size: 0.9rem;"
                        th:text="${s.screenName}">Screen</span>
                    <h4 class="mb-3 text-dark fw-bold" th:text="${s.showTime}"></h4>
                    <p class="text-secondary fs-5 mb-4">Price: <strong>$<span th:text="${s.price}"></span></strong></p>
                    <a th:href="'/user/book/' + ${s.id}"
                        class="btn btn-outline-danger w-100 rounded-pill py-2 shadow-sm font-weight-bold">Select
                        Seats</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
