<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>MyTicket - Premium Movie Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #f8f9fa;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(20, 20, 30, 1), rgba(40, 10, 20, 1));
        }

        .hero-content {
            text-align: center;
            z-index: 10;
            padding: 4rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-premium {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
            color: white;
        }
    </style>
</head>

<body>
    <div class="hero">
        <div class="hero-content">
            <h1 class="display-3 fw-bold mb-4"
                style="background: -webkit-linear-gradient(#f8f9fa, #ff416c); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                MyTicket</h1>
            <p class="lead mb-5 text-light">Experience cinema elegantly. Book your seats instantly.</p>
            <a href="/login" class="btn btn-premium btn-lg mx-2">Login</a>
            <a href="/register" class="btn btn-outline-light btn-lg mx-2 rounded-pill px-4">Register</a>
        </div>
    </div>
</body>

</html>
