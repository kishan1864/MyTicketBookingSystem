<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>User Dashboard - MyTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card-hover:hover {
            transform: translateY(-7px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark px-4 shadow-sm" style="background: linear-gradient(90deg, #b92b27, #1565C0);">
        <a class="navbar-brand fw-bold fs-4" href="#">CineTicket</a>
        <a href="/logout" class="btn btn-outline-light btn-sm rounded-pill px-3">Logout</a>
    </nav>

    <div class="container mt-5">
        <div th:if="${param.success}"
            class="alert alert-success alert-dismissible bg-success text-white border-0 shadow-sm fade show rounded-3">
            Ticket booked successfully! Keep your popcorn ready!</div>

        <h2 class="fw-bold mb-4 text-dark">Now Showing</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
            <div class="col" th:each="m : ${movies}">
                <div class="card h-100 card-hover border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="bg-dark p-4 text-center">
                        <h3 class="card-title fw-bold text-white mb-0" th:text="${m.title}"></h3>
                    </div>
                    <div class="card-body p-4 d-flex flex-column">
                        <p class="card-text text-muted mb-4" th:text="${m.description}"></p>
                        <div class="mt-auto">
                            <span class="badge bg-light text-dark border mb-3 px-3 py-2 rounded-pill shadow-sm"><i
                                    class="bi bi-translate"></i> <span th:text="${m.language}"></span></span>
                            <a th:href="'/user/movie/' + ${m.id}"
                                class="btn btn-danger w-100 rounded-pill py-2 shadow-sm"
                                style="background: linear-gradient(45deg, #ff416c, #ff4b2b); border:none;">View
                                Showtimes</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row border-top pt-5 mb-5 pb-5">
            <div class="col-12">
                <h3 class="fw-bold mb-4 text-dark">My Bookings</h3>
                <div class="table-responsive bg-white rounded-4 shadow-sm p-4 border border-light">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3">Movie</th>
                                <th class="py-3">Time & Screen</th>
                                <th class="py-3">Seat Number</th>
                                <th class="py-3">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${tickets}">
                                <td class="fw-bold fs-5 text-dark" th:text="${t.showTiming.movie.title}"></td>
                                <td><span class="fs-6 d-block" th:text="${t.showTiming.showTime}"></span> <small
                                        class="text-muted fw-bold" th:text="${t.showTiming.screenName}"></small></td>
                                <td><span class="badge rounded-pill bg-dark px-3 py-2 fs-6"
                                        th:text="${t.seatNumber}"></span></td>
                                <td><span class="badge bg-success rounded-pill px-3 py-2" th:text="${t.status}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
