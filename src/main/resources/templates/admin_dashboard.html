<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
    <a class="navbar-brand fw-bold" href="#">CineTicket Admin Panel</a>
    <a href="/logout" class="btn btn-outline-light btn-sm rounded-pill">Logout</a>
</nav>

<div class="container mt-5">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-header bg-primary text-white fw-bold rounded-top-4 py-3">Add New Movie</div>
                <div class="card-body p-4">
                    <form action="/admin/addMovie" method="post">
                        <input type="text" name="title" class="form-control mb-3" placeholder="Movie Title" required>
                        <textarea name="description" class="form-control mb-3" placeholder="Description" rows="3"></textarea>
                        <div class="d-flex gap-2">
                            <input type="text" name="language" class="form-control mb-3" placeholder="Language">
                            <input type="number" name="durationMinutes" class="form-control mb-3" placeholder="Duration (mins)">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill">Save Movie</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-header bg-success text-white fw-bold rounded-top-4 py-3">Schedule Show Timing</div>
                <div class="card-body p-4">
                    <form action="/admin/addShow" method="post">
                        <select name="movieId" class="form-select mb-3">
                            <option th:each="m : ${movies}" th:value="${m.id}" th:text="${m.title}"></option>
                        </select>
                        <input type="text" name="screenName" class="form-control mb-3" placeholder="Screen Name (e.g., Screen 1, VIP Lounge)" required>
                        <input type="datetime-local" name="showTime" class="form-control mb-3" required>
                        <input type="number" step="0.01" name="price" class="form-control mb-4" placeholder="Ticket Price ($)" required>
                        <button type="submit" class="btn btn-success w-100 rounded-pill">Publish Show</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-5 mb-5 pb-5">
        <h4 class="fw-bold mb-3">Master Movie List</h4>
        <div class="list-group shadow-sm rounded-4">
            <div class="list-group-item d-flex justify-content-between align-items-center p-3" th:each="m : ${movies}">
                <div>
                    <strong class="fs-5" th:text="${m.title}"></strong> <span class="badge bg-secondary ms-2" th:text="${m.language}"></span>
                </div>
                <span class="text-muted"><span th:text="${m.durationMinutes}"></span> mins</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
