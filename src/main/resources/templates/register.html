<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register - MyTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #232526, #414345);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div class="card bg-dark text-white p-5 shadow-lg"
        style="width: 28rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
        <h3 class="text-center mb-4 fw-bold">Create Account</h3>
        <form action="/register" method="post">
            <div class="mb-3">
                <label class="form-label ">Username</label>
                <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label ">Email</label>
                <input type="email" name="email" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <div class="mb-4">
                <label class="form-label ">Password</label>
                <input type="password" name="password" class="form-control bg-dark text-light border-secondary"
                    required>
            </div>
            <button type="submit" class="btn w-100 rounded-pill py-2 fw-bold text-white"
                style="background: linear-gradient(45deg, #11998e, #38ef7d); border:none;">Register</button>
        </form>
        <div class="text-center mt-4"><a href="/login" class="text-light text-decoration-none opacity-75">Already have
                an account? Login</a></div>
    </div>
</body>

</html>
