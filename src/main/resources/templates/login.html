<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login - CineTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928DAB);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div class="card bg-dark text-white p-5 shadow-lg"
        style="width: 25rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
        <h3 class="text-center mb-4 fw-bold">Welcome Back</h3>
        <div th:if="${error}" class="alert alert-danger rounded-3" th:text="${error}"></div>
        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label ">Username</label>
                <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <div class="mb-4">
                <label class="form-label ">Password</label>
                <input type="password" name="password" class="form-control bg-dark text-light border-secondary"
                    required>
            </div>
            <button type="submit" class="btn btn-danger w-100 rounded-pill py-2 fw-bold"
                style="background: linear-gradient(45deg, #ff416c, #ff4b2b); border:none;">Login</button>
        </form>
        <div class="text-center mt-4"><a href="/register" class="text-light text-decoration-none opacity-75">Need an
                account? Register</a></div>
    </div>
</body>

</html>
